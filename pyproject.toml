[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openconvert"
version = "0.10.0"
description = "免費、開源、跨平台的通用檔案轉換工具（影片／音訊／圖片／PDF／電子書／文件／資料／字幕／字型／壓縮）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenConvert contributors" }]
keywords = [
    "converter",
    "ffmpeg",
    "pdf",
    "epub",
    "images",
    "office",
    "subtitle",
    "font",
    "desktop",
    "pyside6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Traditional)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "PySide6>=6.6",
    "Pillow>=11.3",
    "pillow-heif>=0.16",
    "pypdf>=4.0",
    "pypdfium2>=4.0",
    "platformdirs>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "Markdown>=3.5",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
    "fonttools>=4.50",
    "brotli>=1.1",
    "cryptography>=42",
    "py7zr>=1.1.4,<2",
    "zstandard>=0.25,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.3",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.gui-scripts]
openconvert = "openconvert.app:main"

[project.scripts]
openconvert-cli = "openconvert.cli:main"

[project.urls]
Homepage = "https://github.com/"
Documentation = "https://github.com/"
Changelog = "https://github.com/"
Issues = "https://github.com/"

[tool.setuptools.packages.find]
include = ["openconvert*"]

[tool.setuptools.package-data]
openconvert = ["py.typed", "modules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = false
ignore_missing_imports = true
