name: Release（Windows 可攜版）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 版本一致性檢查
        run: |
          $version = (python -c "import openconvert; print(openconvert.__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}" -and "${{ github.event_name }}" -eq "push") {
            throw "標籤 ${{ github.ref_name }} 與程式版本 $version 不一致"
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV
        shell: pwsh

      - name: PyInstaller
        run: pyinstaller packaging/openconvert.spec --noconfirm

      - name: 打包 ZIP（模組化：引擎依需要在程式內下載）
        run: Compress-Archive -Path dist/OpenConvert/* -DestinationPath "OpenConvert-$env:VERSION-windows-x64.zip"
        shell: pwsh

      - name: 上傳 Release 附件
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: OpenConvert-*-windows-x64.zip
          generate_release_notes: true

      - name: 上傳建置產物（手動執行時）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: OpenConvert-windows-x64
          path: OpenConvert-*-windows-x64.zip
          if-no-files-found: error
