name: Release（Windows 可攜版）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 程式碼簽章（Azure Artifact Signing，原 Trusted Signing）。
  # 全部留空 → 自動跳過簽章，產物與之前相同（未簽章）。
  # 設定方式見 docs/signing.md。
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
  AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
  AZURE_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_SIGNING_CERT_PROFILE }}
  # 備援：可匯出的 PFX 憑證（base64）
  CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}
  CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 版本一致性檢查
        run: |
          $version = (python -c "import openconvert; print(openconvert.__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}" -and "${{ github.event_name }}" -eq "push") {
            throw "標籤 ${{ github.ref_name }} 與程式版本 $version 不一致"
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV
        shell: pwsh

      - name: PyInstaller
        run: pyinstaller packaging/openconvert.spec --noconfirm

      - name: 程式碼簽章（Azure Artifact Signing）
        if: env.AZURE_TENANT_ID != ''
        uses: Azure/artifact-signing-action@v1.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERT_PROFILE }}
          files-folder: dist/OpenConvert
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: 程式碼簽章（PFX 憑證，備援）
        if: env.CODE_SIGNING_PFX != '' && env.AZURE_TENANT_ID == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGNING_PFX))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName | Select-Object -Last 1).FullName
          if (-not $signtool) { throw "找不到 signtool.exe" }
          & $signtool sign /f $pfx /p $env:CODE_SIGNING_PFX_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            "dist\OpenConvert\OpenConvert.exe" "dist\OpenConvert\OpenConvertCLI.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool 簽章失敗（$LASTEXITCODE）" }

      - name: 簽章狀態與公開憑證匯出
        shell: pwsh
        run: |
          $signer = $null
          foreach ($file in @("dist\OpenConvert\OpenConvert.exe", "dist\OpenConvert\OpenConvertCLI.exe")) {
            $signature = Get-AuthenticodeSignature $file
            $name = [IO.Path]::GetFileName($file)
            "簽章狀態 $name ： $($signature.Status)"
            if ($null -eq $signer -and $null -ne $signature.SignerCertificate) {
              $signer = $signature.SignerCertificate
            }
          }
          if ($null -ne $signer) {
            # 匯出公開憑證放進 ZIP，讓使用者安裝（自簽憑證需要）
            [IO.File]::WriteAllBytes("dist\OpenConvert\openconvert-codesign.cer", `
              $signer.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            "已匯出公開憑證 openconvert-codesign.cer"
          } else {
            "未設定程式碼簽章：產物維持未簽章（SmartScreen 可能會提示）。"
          }

      - name: 打包 ZIP（模組化：引擎依需要在程式內下載）
        run: Compress-Archive -Path dist/OpenConvert/* -DestinationPath "OpenConvert-$env:VERSION-windows-x64.zip"
        shell: pwsh

      - name: 上傳 Release 附件
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: OpenConvert-*-windows-x64.zip
          generate_release_notes: true

      - name: 上傳建置產物（手動執行時）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: OpenConvert-windows-x64
          path: OpenConvert-*-windows-x64.zip
          if-no-files-found: error
