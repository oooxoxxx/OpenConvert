name: 引擎資產

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "引擎 Release 標籤"
        default: "engines-v2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  libreoffice-stripped:
    name: 精簡版 LibreOffice
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 下載官方 MSI 並製作剝離版（SHA-256 驗證）
        run: python scripts/build_libreoffice_module.py --out assets
        env:
          PYTHONUTF8: "1"

      - name: 上傳到引擎 Release
        run: |
          gh release create "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --title "引擎資產 ${{ inputs.tag }}" \
            --notes "OpenConvert 引擎模組的下載來源（SHA-256 見 openconvert/modules/manifest.json）。" || true
          gh release upload "${{ inputs.tag }}" assets/* --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash

      - name: 上傳建置產物
        uses: actions/upload-artifact@v7
        with:
          name: libreoffice-stripped
          path: assets/*
          if-no-files-found: error
